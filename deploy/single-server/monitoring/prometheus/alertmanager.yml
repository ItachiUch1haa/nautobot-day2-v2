route:
  receiver: "default"
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: "default"
    # Fill in whatever channel you want alerts routed to before deploying.
    # Slack example:
