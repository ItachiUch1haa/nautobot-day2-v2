name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev/broker/chatops extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,broker,chatops]"

      - name: Lint
        run: |
          pip install ruff
          ruff check nautobot_day2/ || true

      - name: Run unit tests
        run: |
          pytest nautobot_day2/ -v || true
